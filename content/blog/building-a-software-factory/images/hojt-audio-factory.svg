<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1210" width="940" height="1210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The software factory in hojt-audio</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#34503f"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d6e3a"/>
    </marker>
    <style>
      .agent { fill: #d9f0d6; stroke: #2c9150; stroke-width: 1.5; }
      .script { fill: #ffffff; stroke: #587061; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .human { fill: #fdf0d5; stroke: #c98a1b; stroke-width: 2; }
      .file { fill: #eef3fb; stroke: #4a6a9a; stroke-width: 1.5; }
      .state { fill: #2c9150; }
      .callout { fill: #e6f2dc; stroke: #2c9150; stroke-width: 1.2; }
      .legend-box { fill: #ebf4e4; stroke: #c5dec0; stroke-width: 1.2; }
      .t { fill: #153023; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .s { fill: #34503f; font-size: 12px; text-anchor: middle; }
      .st { fill: #ffffff; font-size: 13.5px; font-weight: 600; text-anchor: middle; }
      .ct { fill: #153023; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .cs { fill: #34503f; font-size: 11.5px; text-anchor: middle; }
      .flow { stroke: #34503f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #1d6e3a; stroke-width: 2; fill: none; stroke-dasharray: 7 4; marker-end: url(#arrow-loop); }
      .lbl { fill: #244232; font-size: 11.5px; font-style: italic; }
      .legend { fill: #153023; font-size: 12.5px; font-weight: 500; }
    </style>
  </defs>

  <rect x="0" y="0" width="940" height="1210" fill="#f4f9ee"/>

  <!-- Intake -->
  <rect class="agent" x="145" y="16" width="195" height="68" rx="8"/>
  <text class="t" x="242" y="43">Scout agent</text>
  <text class="s" x="242" y="63">max 3 ideas weekly</text>

  <rect class="script" x="352" y="16" width="206" height="68" rx="8"/>
  <text class="t" x="455" y="38">Weekly checks</text>
  <text class="s" x="455" y="56">detects outdated dependencies,</text>
  <text class="s" x="455" y="72">documentation drift, stale issues</text>

  <rect class="human" x="570" y="16" width="195" height="68" rx="8"/>
  <text class="t" x="667" y="43">Users</text>
  <text class="s" x="667" y="63">issues</text>

  <path class="flow" d="M242,84 L375,118"/>
  <path class="flow" d="M455,84 L455,116"/>
  <path class="flow" d="M667,84 L535,118"/>

  <rect class="state" x="325" y="118" width="260" height="40" rx="20"/>
  <text class="st" x="455" y="143">Backlog</text>

  <!-- Spec -->
  <path class="flow" d="M455,158 L455,188"/>
  <rect class="agent" x="295" y="190" width="320" height="60" rx="8"/>
  <text class="t" x="455" y="215">Specwriter agent</text>
  <text class="s" x="455" y="235">runs daily, refines issues</text>

  <path class="flow" d="M455,250 L455,278"/>
  <rect class="state" x="325" y="280" width="260" height="40" rx="20"/>
  <text class="st" x="455" y="305">Refined issue</text>

  <!-- Gate 1 -->
  <path class="flow" d="M455,320 L455,348"/>
  <rect class="human" x="295" y="350" width="320" height="60" rx="8"/>
  <text class="t" x="455" y="375">Owner approves the spec</text>
  <text class="s" x="455" y="395">approval-guard strips anyone else's approval</text>

  <path class="flow" d="M455,410 L455,438"/>
  <rect class="state" x="325" y="440" width="260" height="40" rx="20"/>
  <text class="st" x="455" y="465">Approved issue for development</text>

  <!-- Build + review -->
  <path class="flow" d="M455,480 L455,508"/>
  <rect class="agent" x="295" y="510" width="320" height="60" rx="8"/>
  <text class="t" x="455" y="535">Builder agent</text>
  <text class="s" x="455" y="555">runs nightly, implements issue and produces PR</text>

  <!-- needs:engineer loop from Builder up to Owner -->
  <path class="loop" d="M595,510 L595,412"/>
  <text class="lbl" x="603" y="465">questions for owner</text>

  <rect class="agent" x="650" y="510" width="175" height="60" rx="8"/>
  <text class="t" x="737" y="535">Reviewer agent</text>
  <text class="s" x="737" y="555">performs independent review</text>

  <path class="flow" d="M615,528 L648,528"/>
  <path class="flow" d="M650,553 L617,553"/>
  <text class="lbl" x="619" y="521">diff</text>
  <text class="lbl" x="617" y="568">revise</text>

  <!-- CI -->
  <path class="flow" d="M455,570 L455,598"/>
  <rect class="script" x="295" y="600" width="320" height="60" rx="8"/>
  <text class="t" x="455" y="625">Pull request + CI</text>
  <text class="s" x="455" y="645">automated tests, linting and regression checks</text>

  <path class="flow" d="M455,660 L455,688"/>
  <rect class="state" x="325" y="690" width="260" height="40" rx="20"/>
  <text class="st" x="455" y="715">auto-merge to main</text>

  <!-- Release prep -->
  <path class="flow" d="M455,730 L455,758"/>
  <rect class="agent" x="295" y="760" width="320" height="60" rx="8"/>
  <text class="t" x="455" y="785">Release Manager agent</text>
  <text class="s" x="455" y="805">runs weekly, creates release PR</text>

  <!-- Gate 2 -->
  <path class="flow" d="M455,820 L455,848"/>
  <rect class="human" x="295" y="850" width="320" height="60" rx="8"/>
  <text class="t" x="455" y="875">Owner merges and tags</text>
  <text class="s" x="455" y="895">validates and tags for release</text>

  <path class="flow" d="M455,910 L455,938"/>
  <rect class="script" x="295" y="940" width="320" height="60" rx="8"/>
  <text class="t" x="455" y="965">Release build (release.yml)</text>
  <text class="s" x="455" y="985">tests the installer, then publishes</text>

  <!-- Release review -->
  <path class="flow" d="M455,1000 L455,1028"/>
  <rect class="agent" x="295" y="1030" width="320" height="72" rx="8"/>
  <text class="t" x="455" y="1055">Release Analyst agent</text>
  <text class="s" x="455" y="1074">evaluates adoption, bugs and feedback at</text>
  <text class="s" x="455" y="1091">7 &amp; 28 days; proposes follow-up ideas</text>

  <!-- Product feedback loop (right) -->
  <path class="loop" d="M615,1066 L855,1066 L855,138 L587,138"/>
  <rect class="callout" x="762" y="655" width="166" height="58" rx="8"/>
  <text class="ct" x="845" y="677">Files follow-up ideas</text>
  <text class="cs" x="845" y="694">into Backlog (max 3/run)</text>
  <text class="cs" x="845" y="708">from release findings</text>

  <!-- Agent instructions & skills (left) -->
  <rect class="file" x="35" y="182" width="215" height="92" rx="8"/>
  <text class="t" x="142" y="207">Instructions &amp; skills</text>
  <text class="s" x="142" y="226">CLAUDE.md + .claude/skills/ —</text>
  <text class="s" x="142" y="243">shared rules and workflow steps</text>
  <text class="s" x="142" y="260">loaded by every agent run</text>
  <path class="loop" d="M250,220 L293,220"/>

  <path class="loop" d="M295,380 L172,380 L172,276"/>
  <text class="lbl" x="178" y="340">owner feedback</text>
  <text class="lbl" x="178" y="355">adds rules</text>

  <!-- Retrospective agent (left) -->
  <rect class="agent" x="35" y="490" width="215" height="80" rx="8"/>
  <text class="t" x="142" y="515">Retrospective agent</text>
  <text class="s" x="142" y="535">reviews each build's transcript,</text>
  <text class="s" x="142" y="552">PR comments and CI failures</text>

  <path class="flow" d="M295,540 L252,540"/>
  <path class="loop" d="M92,490 L92,276"/>
  <text class="lbl" x="99" y="435">recurring causes → rules</text>

  <!-- Retro issues into Backlog (left outer loop) -->
  <path class="loop" d="M35,530 L16,530 L16,138 L323,138"/>
  <rect class="callout" x="45" y="119" width="145" height="38" rx="6"/>
  <text class="ct" x="117" y="135">Files retro issues</text>
  <text class="cs" x="117" y="150">into Backlog</text>

  <!-- Health metrics loop (left) -->
  <rect class="script" x="35" y="645" width="215" height="92" rx="8"/>
  <text class="t" x="142" y="670">Weekly health metrics</text>
  <text class="s" x="142" y="689">script records downloads, CI pass</text>
  <text class="s" x="142" y="706">rate, lead times, CPU and loudness</text>
  <text class="s" x="142" y="723">to the metrics branch</text>

  <path class="loop" d="M295,970 L165,970 L165,739"/>
  <text class="lbl" x="172" y="950">collects release</text>
  <text class="lbl" x="172" y="965">&amp; repo stats</text>

  <path class="loop" d="M85,737 L85,1066 L293,1066"/>
  <text class="lbl" x="93" y="1058">feeds download &amp; health data</text>

  <!-- Legend -->
  <rect class="legend-box" x="125" y="1124" width="660" height="68" rx="10"/>

  <!-- Legend Row 1 -->
  <rect class="agent" x="155" y="1138" width="24" height="16" rx="4"/>
  <text class="legend" x="188" y="1151">LLM agent</text>

  <rect class="script" x="340" y="1138" width="24" height="16" rx="4"/>
  <text class="legend" x="373" y="1151">Deterministic script / CI</text>

  <rect class="human" x="585" y="1138" width="24" height="16" rx="4"/>
  <text class="legend" x="618" y="1151">Human in the loop</text>

  <!-- Legend Row 2 -->
  <rect class="file" x="155" y="1164" width="24" height="16" rx="4"/>
  <text class="legend" x="188" y="1177">Instructions in repo</text>

  <rect class="state" x="340" y="1164" width="24" height="16" rx="8"/>
  <text class="legend" x="373" y="1177">Workflow stage</text>

  <path class="loop" d="M582,1172 L612,1172"/>
  <text class="legend" x="622" y="1177">Feedback loop</text>
</svg>
